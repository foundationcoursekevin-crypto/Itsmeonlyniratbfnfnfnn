# PixelBeeOS 3.2 boot menu. The first entry picks the biggest mode your screen offers.
# If the screen is blank, garbled or the wrong size, reboot and choose a "Safe graphics" entry.
set timeout=3
set default=0
insmod all_video
insmod gfxterm
set gfxmode=1366x768x32,1280x800x32,1280x720x32,1024x768x32,800x600x32,auto   # fast, crisp default; bigger screens: pick the Full HD / largest entry
set gfxpayload=keep
terminal_output gfxterm

menuentry "PixelBeeOS 3.2 (1366x768, fastest)" {
  multiboot /boot/kernel.elf
  boot
}
menuentry "PixelBeeOS 3.2 - Full HD 1920x1080 (needs a fast PC)" {
  set gfxmode=1920x1080x32,1920x1200x32,1600x900x32,auto
  set gfxpayload=keep
  multiboot /boot/kernel.elf
  boot
}
menuentry "PixelBeeOS 3.2 - Largest resolution (native panel)" {
  set gfxmode=auto
  set gfxpayload=keep
  multiboot /boot/kernel.elf
  boot
}
menuentry "PixelBeeOS 3.2 - Safe graphics 1024x768" {
  set gfxmode=1024x768x32,1024x768x24,1024x768x16,auto
  set gfxpayload=keep
  multiboot /boot/kernel.elf
  boot
}
menuentry "PixelBeeOS 3.2 - Safe graphics 800x600" {
  set gfxmode=800x600x32,800x600x24,800x600x16,auto
  set gfxpayload=keep
  multiboot /boot/kernel.elf
  boot
}
