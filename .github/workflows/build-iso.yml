name: Build PixelBeeOS 100 MB ISO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub-common xorriso mtools

      - name: Build kernel and 100 MB ISO
        run: |
          make clean
          make iso-100mb
          mv pixelbeeos.iso pixelbeeos-100mb.iso
          ls -l pixelbeeos-100mb.iso
          test "$(stat -c%s pixelbeeos-100mb.iso)" -eq 104857600

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: pixelbeeos-100mb-iso
          path: pixelbeeos-100mb.iso
          compression-level: 9
